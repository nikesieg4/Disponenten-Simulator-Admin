<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://virsphrwhskjquenyhsj.supabase.co; base-uri 'none'; form-action 'none'">
<title>Codes Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><span class="dot"></span><b>LEITSTELLE</b> <span class="sub">Codes-Admin</span><span class="sp"></span><span id="sess" class="sub"></span><button id="logout" class="btn ghost hidden">Abmelden</button></header>

<main>
  <section id="login" class="card narrow">
    <h1>Anmelden</h1>
    <p class="hint">Admin-Passwort. Es wird im Supabase-SQL-Editor mit <code>select admin_set_password('…');</code> festgelegt.</p>
    <form id="login-form" autocomplete="off">
      <label class="fld"><span>Passwort</span><input id="pw" type="password" autocomplete="current-password" required minlength="12"></label>
      <button class="btn primary" type="submit">Anmelden</button>
    </form>
    <p id="login-err" class="err" role="alert"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h2 id="form-title">Neuer Code</h2>
      <form id="code-form" autocomplete="off">
        <div class="row">
          <label class="fld"><span>Code</span><input id="f-code" required pattern="[A-Za-z0-9_\-]{3,32}" maxlength="32" placeholder="SOMMER25"></label>
          <button type="button" class="btn ghost" id="f-random">Zufällig</button>
          <label class="fld grow"><span>Notiz (nur für dich)</span><input id="f-note" maxlength="200" placeholder="z. B. Instagram-Post 24.10."></label>
        </div>
        <div class="row">
          <label class="fld"><span>Läuft ab (leer = permanent)</span><input id="f-exp" type="datetime-local"></label>
          <label class="fld"><span>Max. Einlösungen (leer = unbegrenzt)</span><input id="f-max" type="number" min="1" step="1"></label>
          <label class="fld"><span>Nur Konten jünger als … Tage</span><input id="f-new" type="number" min="1" step="1" placeholder="alle"></label>
          <label class="chk"><input id="f-active" type="checkbox" checked> Aktiv</label>
        </div>
        <h3>Belohnungen</h3>
        <div id="rewards"></div>
        <div class="row">
          <button type="button" class="btn ghost" data-add="money">+ Geld</button>
          <button type="button" class="btn ghost" data-add="staff">+ Personal</button>
          <button type="button" class="btn ghost" data-add="building">+ Gebäude-Gutschein</button>
          <button type="button" class="btn ghost" data-add="extension">+ Erweiterungs-Gutschein</button>
        </div>
        <div class="row end">
          <button type="button" class="btn ghost hidden" id="f-cancel">Abbrechen</button>
          <button type="submit" class="btn primary" id="f-save">Code speichern</button>
        </div>
        <p id="form-err" class="err" role="alert"></p>
      </form>
    </div>

    <div class="card">
      <div class="row"><h2>Codes</h2><span class="sp"></span><button class="btn ghost" id="reload">Aktualisieren</button></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Code</th><th>Belohnungen</th><th>Gültig</th><th>Eingelöst</th><th>Status</th><th></th></tr></thead>
        <tbody id="codes"></tbody>
      </table></div>
      <div id="redeemers" class="hidden"></div>
    </div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
